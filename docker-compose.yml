
services:
  db:
    image: postgres:16
    container_name: dealership_db
    environment:
      POSTGRES_USER: dealership
      POSTGRES_PASSWORD: dealership_pass
      POSTGRES_DB: dealership_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dealership"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: